name: open-iscsi aarch64 (bionic, NDK Makefile)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      # Our own repo carries scripts/ois_patch.py -- the single source of truth
      # for every Android/bionic source tweak.
      - name: Checkout build repo
        uses: actions/checkout@v4

      - name: Install host build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential pkg-config curl unzip xz-utils perl

      - name: Install Android NDK r27c
        run: |
          cd /opt
          curl -fsSL -o ndk.zip https://dl.google.com/android/repository/android-ndk-r27c-linux.zip
          unzip -q ndk.zip
          NDKBIN=/opt/android-ndk-r27c/toolchains/llvm/prebuilt/linux-x86_64/bin
          echo "NDK=/opt/android-ndk-r27c" >> "$GITHUB_ENV"
          echo "NDKBIN=$NDKBIN" >> "$GITHUB_ENV"
          # Target Android API 33 rather than the NDK floor: bionic only exposes
          # glob()/getentropy() from API 28 onwards, and open-iscsi needs glob().
          # Prefer the highest API level the toolchain actually ships.
          API=""
          for want in 33 30 28 26 24; do
            if [ -e "$NDKBIN/aarch64-linux-android${want}-clang" ]; then
              API=$want; break
            fi
          done
          if [ -z "$API" ]; then
            echo "no usable aarch64 clang wrapper in $NDKBIN"; ls "$NDKBIN" | head; exit 1
          fi
          echo "ANDROID_API=$API" >> "$GITHUB_ENV"
          echo "CLANG=$NDKBIN/aarch64-linux-android${API}-clang" >> "$GITHUB_ENV"
          echo "using ANDROID_API=$API"
          ls -1 "$NDKBIN" | grep -E 'aarch64-linux-android[0-9]+-clang$' | head

      - name: Cross-compile OpenSSL (static libcrypto for bionic)
        run: |
          cd /opt
          curl -fsSL -o ossl.tar.gz https://www.openssl.org/source/openssl-3.3.2.tar.gz
          tar xzf ossl.tar.gz
          cd openssl-3.3.2
          export PATH="/opt/android-ndk-r27c/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          # The NDK's versioned clang wrapper already embeds
          # --target=aarch64-linux-android24 + the bionic sysroot, so using the
          # generic 'linux-aarch64' target yields a bionic-linked libcrypto.a
          # while sidestepping OpenSSL's android-arm64 probe (15-android.conf),
          # which is broken against NDK r27's layout.
          export CC=aarch64-linux-android${{ env.ANDROID_API }}-clang
          export CXX=aarch64-linux-android${{ env.ANDROID_API }}-clang++
          export AR=llvm-ar
          export RANLIB=llvm-ranlib
          export NM=llvm-nm
          ./Configure linux-aarch64 --prefix=/opt/ossl \
            no-shared no-tests no-dso no-dtls no-afalgeng no-ui-console no-devcryptoeng
          make -j"$(nproc)"
          make install_sw
          ls -l /opt/ossl/lib/libcrypto.a
          export PATH="/opt/android-ndk-r27c/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          llvm-readelf -h /opt/ossl/lib/libcrypto.a 2>/dev/null | grep -i 'Machine' | head -2

      - name: Clone open-iscsi 2.1.10
        run: git clone --depth 1 --branch 2.1.10 https://github.com/open-iscsi/open-iscsi.git open-iscsi

      - name: Patch open-iscsi for Android/bionic
        run: |
          cd open-iscsi
          python3 "$GITHUB_WORKSPACE/scripts/ois_patch.py" .

      - name: Build open-iscsi (NDK clang)
        run: |
          cd open-iscsi
          export PATH="${{ env.NDKBIN }}:$PATH"
          export CC="${{ env.CLANG }}"
          export AR=llvm-ar
          export RANLIB=llvm-ranlib
          export STRIP=llvm-strip
          export CROSS_COMPILE=
          export CFLAGS="-I/opt/ossl/include"
          export LDFLAGS="-L/opt/ossl/lib"
          export OPTFLAGS="-O2"
          export NO_SYSTEMD=1
          export HOMEDIR=/data/local/etc/iscsi
          export DBROOT=/data/local/var/lib/iscsi
          make -C libopeniscsiusr
          make -C sysdeps || true
          make -C usr iscsiadm iscsid iscsistart
          make -C utils iscsi-iname 2>/dev/null || true

      - name: Collect, strip & inspect
        run: |
          mkdir -p ois_out
          cp open-iscsi/usr/iscsiadm open-iscsi/usr/iscsid open-iscsi/usr/iscsistart ois_out/ 2>/dev/null || true
          cp open-iscsi/utils/iscsi-iname ois_out/ 2>/dev/null || true
          cp open-iscsi/libopeniscsiusr/libopeniscsiusr.so* ois_out/ 2>/dev/null || true
          for b in ois_out/iscsiadm ois_out/iscsid ois_out/iscsistart; do
            llvm-strip --strip-unneeded "$b" 2>/dev/null || true
          done
          echo "=== file ==="
          FILES=""
          for b in ois_out/iscsiadm ois_out/iscsid ois_out/iscsistart; do
            [ -f "$b" ] && FILES="$FILES $b"
          done
          file $FILES
          echo "=== NEEDED entries (runtime deps) ==="
          for b in $FILES; do
            echo "--- $b ---"
            llvm-readelf -d "$b" 2>/dev/null | grep -i 'NEEDED\|RUNPATH' || true
          done
          echo "=== directory listing ==="
          ls -l ois_out/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: open-iscsi-aarch64-android
          path: ois_out/*
